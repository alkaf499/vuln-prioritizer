# ============================================================================
# SYNTHETIC EXAMPLE — NOT REAL CMDB DATA.
# Generic, illustrative CMDB classification overlay: device-class rules keyed on hostname and
# operating-system strings, with an OT/ICS-style naming scheme as one example family.
# Copy to a path OUTSIDE the repo and adapt it (or replace it with a rule file generated from
# your real CMDB export — see README "Pointing at a real CMDB"). A lab- or site-specific
# overlay belongs in out/ (gitignored), never here.
#
# Rules are evaluated top to bottom; FIRST MATCH WINS, so specific rules go first.
# `match` keys (all must match): hostname, operating_system, fqdn, ip, asset_id
# Patterns are case-insensitive globs (* ? [seq]). A key whose asset value is empty never
# matches (FQDN is empty on many scanner inventories, so this file uses hostname and
# operating_system).
#
# Environment is descriptive and never excludes. Only `in_scope: false` excludes, and
# excluded assets are counted and reported separately.
#
# Criticality values: crown_jewel > cj_support > rto_defined > standard.
# A `role` is what the executive report groups by; give every rule one.
# ============================================================================
defaults: { environment: unknown, exposure: internal, criticality: standard, in_scope: true }

assets:
  # --- Lifecycle exclusion ---------------------------------------------------------------
  # Covered by pre-prod patch testing. Placed FIRST so a dev-* host running Windows Server is
  # excluded instead of being caught by the server rule below.
  - match: { hostname: "dev-*" }
    role: dev_host
    environment: non_production
    in_scope: false
    reason: "dev/test hosts are covered by pre-prod patch testing"

  # --- OT/ICS assets — business-critical by definition ----------------------------------
  - match: { hostname: "plc #*" }
    role: ot_plc
    environment: production
    criticality: crown_jewel
  - match: { hostname: "ot device #*" }
    role: ot_device
    environment: production
    criticality: crown_jewel
  - match: { hostname: "field device #*" }
    role: field_device
    environment: production
    criticality: cj_support
  - match: { hostname: "comm. adapter #*" }
    role: comm_adapter
    environment: production
    criticality: cj_support

  # --- Identity infrastructure ----------------------------------------------------------
  # Domain controllers: compromise of one is compromise of the estate. BEFORE the generic
  # Windows Server rule so "dc*" hosts are not classified as plain servers.
  - match: { hostname: "dc*" }
    role: domain_controller
    environment: production
    criticality: crown_jewel

  # --- Out-of-band management controllers (iDRAC / iLO / IPMI / BMC) --------------------
  # Full control of the host underneath; treated as crown jewels.
  - match: { hostname: "*idrac*" }
    role: bmc
    environment: production
    criticality: crown_jewel
  - match: { hostname: "ilo-*" }
    role: bmc
    environment: production
    criticality: crown_jewel
  - match: { hostname: "*-ilo" }
    role: bmc
    environment: production
    criticality: crown_jewel
  - match: { hostname: "*ipmi*" }
    role: bmc
    environment: production
    criticality: crown_jewel
  - match: { operating_system: "*iDRAC*" }
    role: bmc
    environment: production
    criticality: crown_jewel
  - match: { operating_system: "*Integrated Lights-Out*" }
    role: bmc
    environment: production
    criticality: crown_jewel
  - match: { operating_system: "*IPMI*" }
    role: bmc
    environment: production
    criticality: crown_jewel

  # --- Perimeter firewalls — internet-facing by role ------------------------------------
  - match: { operating_system: "Palo Alto Networks PAN-OS*" }
    role: perimeter_firewall
    environment: production
    exposure: external
  - match: { operating_system: "*FortiOS*" }
    role: perimeter_firewall
    environment: production
    exposure: external
  - match: { operating_system: "*SonicOS*" }
    role: perimeter_firewall
    environment: production
    exposure: external
  - match: { operating_system: "*Check Point*" }
    role: perimeter_firewall
    environment: production
    exposure: external
  - match: { operating_system: "*Cisco Adaptive Security*" }
    role: perimeter_firewall
    environment: production
    exposure: external
  - match: { operating_system: "*pfSense*" }
    role: perimeter_firewall
    environment: production
    exposure: external

  # --- Hypervisors — one host carries many business workloads ---------------------------
  - match: { operating_system: "*VMware ESXi*" }
    role: hypervisor
    environment: production
    criticality: cj_support
  - match: { operating_system: "*Proxmox*" }
    role: hypervisor
    environment: production
    criticality: cj_support
  - match: { operating_system: "*XenServer*" }
    role: hypervisor
    environment: production
    criticality: cj_support

  # --- Network infrastructure (switches, routers, embedded RTOS devices) ----------------
  - match: { operating_system: "*Cisco IOS*" }
    role: network_device
    environment: production
    criticality: cj_support
  - match: { operating_system: "*Cisco Nexus*" }
    role: network_device
    environment: production
    criticality: cj_support
  - match: { operating_system: "*VxWorks*" }
    role: network_device
    environment: production
    criticality: cj_support

  # --- Servers ---------------------------------------------------------------------------
  - match: { operating_system: "Microsoft Windows Server*" }
    role: server
    environment: production

  # --- End-user devices — non-production, but IN SCOPE ----------------------------------
  - match: { hostname: "endpoint #*" }
    role: workstation
    environment: non_production
    criticality: standard
    in_scope: true        # flip to false if the VM procedure is server-only
  - match: { hostname: "work station #*" }
    role: workstation
    environment: non_production
    criticality: standard
  - match: { operating_system: "Microsoft Windows 1[01]*" }
    role: workstation
    environment: non_production
    criticality: standard
